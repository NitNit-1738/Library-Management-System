{% extends "base.html" %}
{% block content %}
<h1 class="h4">Borrow: {{ book.Title }}</h1>
<form method="post" class="card p-3">
  <div class="mb-3">
    <label class="form-label">Member ID</label>
    <input name="member_id" class="form-control" placeholder="Enter your Member ID" required>
  </div>
  <button class="btn btn-primary">Confirm Borrow</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('book_detail', book_id=book.BookID) }}">Cancel</a>
</form>
{% endblock %}
